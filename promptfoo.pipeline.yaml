description: Open Oracle full pipeline synthetic contract regressions; zero paid calls
prompts:
  - "{{case_id}}"
providers:
  - id: file://evals/pipeline_provider.py
    config:
      pythonExecutable: .venv/bin/python
      repo_root: .
      language_root: open_oracle
defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: "JSON.parse(output).status === 'pass'"
    - type: javascript
      value: "JSON.parse(output).evidence_tier === 'synthetic' && JSON.parse(output).human_adjudicated === false"
tests:
  - vars: {case_id: source-positive}
  - vars: {case_id: source-gap}
  - vars: {case_id: vote-refusal}
  - vars: {case_id: scope-clarification}
